name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  VAULT_VERSION: 1.17.6

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - name: validate
        working-directory: terraform
        run: terraform init -input=false && terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - name: tflint
        working-directory: terraform
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl" && tflint --config "$GITHUB_WORKSPACE/.tflint.hcl"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Install Vault
        run: |
          curl -sSLo vault.zip "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          unzip -q vault.zip vault && sudo mv vault /usr/local/bin/ && rm vault.zip
      - run: shellcheck scripts/*.sh
      - name: Apply config to a dev server and assert policies
        run: ./scripts/integration-test.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint && yamllint -s .
      - name: kubeconform (Vault Secrets Operator / ESO CRDs)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            kubernetes
